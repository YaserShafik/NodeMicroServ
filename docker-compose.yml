services:
  api-gateway:
    build: ./gateway
    ports:
      - "3000:3000"
    depends_on:
      - users-service
      - products-service
      - orders-service

  users-service:
    build: ./users-service
    ports:
      - "4000:4000"
    links:
      - mongodb
    environment:
      - MONGODB_URI=mongodb+srv://yaser:pies3,14@cluster0.2ysbtpk.mongodb.net/NMS-users?retryWrites=true&w=majority&appName=Cluster0
    depends_on:
      - rabbitmq
      - mongodb

  chatgpt-service:
    build: ./chatgpt-service
    ports:
      -"4003:4003"
    links:
      - chatgpt
    depends_on:
      - rabbitmq
      - mongodb
      
  products-service:
    build: ./products-service
    ports:
      - "4001:4001"
    links:
      - mongodb
    environment:
      - MONGODB_URI=mongodb+srv://yaser:pies3,14@cluster0.2ysbtpk.mongodb.net/NMS-products?retryWrites=true&w=majority&appName=Cluster0
    depends_on:
      - rabbitmq
      - mongodb
    healthcheck:
      test: ["CMD", "curl", "-f", "http://rabbitmq:15672"]
      interval: 30s
      timeout: 10s
      retries: 5

  orders-service:
    build: ./orders-service
    ports:
      - "4002:4002"
    links:
      - mongodb
    environment:
      - MONGODB_URI=mongodb+srv://yaser:pies3,14@cluster0.2ysbtpk.mongodb.net/NMS-services?retryWrites=true&w=majority&appName=Cluster0
    depends_on:
      - rabbitmq
      - mongodb
    healthcheck:
      test: ["CMD", "curl", "-f", "http://rabbitmq:15672"]
      interval: 30s
      timeout: 10s
      retries: 5

  rabbitmq:
    image: "rabbitmq:3-management"
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmqctl", "status"]
      interval: 30s
      timeout: 10s
      retries: 5

  mongodb:
    image: mongo
    ports:
      - "27017:27017"